<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrizePicks Group Tracker — 2026</title>
<style>
:root {
  --bg:#0b0d14;
  --panel:#141824;
  --panel2:#1b2030;
  --text:#f5f7fb;
  --muted:#9ba3b5;
  --line:#2a3042;
  --purple:#8c5cff;
  --green:#63ff32;
  --red:#ff4d67;
  --amber:#ffbf47;
  --blue:#59b8ff;
  --shadow:0 14px 36px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top left,#18122b 0,#0b0d14 38%,#090b11 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit}
.app{max-width:1320px;margin:0 auto;padding:22px}
.header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 20px;background:rgba(20,24,36,.92);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:10;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--purple),#b78cff);display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:0 8px 24px rgba(140,92,255,.35)}
.brand h1{font-size:20px;margin:0}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{background:#101522;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.nav button.active{background:var(--purple);color:white;border-color:transparent}
.view{display:none;padding-top:22px}
.view.active{display:block}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:16px}
.card{background:linear-gradient(180deg,rgba(27,32,48,.98),rgba(20,24,36,.98));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi .value{font-size:28px;font-weight:800;margin-top:7px}
.kpi .hint{color:var(--muted);font-size:12px;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:10px 0 10px;gap:10px}
.section-title h2{font-size:18px;margin:0}
.section-title span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
th{color:#cbd2e3;font-weight:700;background:#111522}
td{color:#eef1f8}
.rank{font-weight:800}
.picker{font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.badge.goblin{background:rgba(99,255,50,.10);color:var(--green);border:1px solid rgba(99,255,50,.35)}
.badge.demon{background:rgba(255,77,103,.10);color:var(--red);border:1px solid rgba(255,77,103,.35)}
.badge.std{background:rgba(155,163,181,.12);color:#c8cfdb;border:1px solid rgba(155,163,181,.3)}
.type-icon{width:15px;height:15px;display:inline-block;vertical-align:-2px}
.type-icon svg{width:15px;height:15px;display:block}
.result.win{color:var(--green);font-weight:900}
.result.loss{color:var(--red);font-weight:900}
.hero-grid{grid-template-columns:1.2fr .8fr}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.card-title{font-size:20px;font-weight:900}
.card-sub{color:var(--muted);font-size:13px;margin-top:4px}
.record{font-size:34px;font-weight:900}
.picks-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pick-tile{background:#101522;border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.pick-tile.win{box-shadow:inset 0 3px 0 var(--green)}
.pick-tile.loss{box-shadow:inset 0 3px 0 var(--red)}
.pick-tile .who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick-tile .player{font-weight:900;margin-top:8px}
.pick-tile .prop{font-size:12px;color:#d8ddea;margin-top:4px}
.pick-tile .actual{font-size:12px;color:var(--muted);margin-top:10px}
.pick-tile .score{font-size:22px;font-weight:900;margin-top:8px}
.pick-tile .score-label{font-size:10px;color:var(--muted);text-transform:uppercase}
.mini-bar{height:8px;background:#0a0d13;border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid #22293a}
.mini-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--green))}
.matrix{display:grid;grid-template-columns:130px repeat(1,90px);gap:8px;align-items:center}
.matrix .head,.matrix .rowlabel{color:var(--muted);font-size:12px}
.matrix .cell{display:grid;place-items:center;height:44px;border-radius:12px;font-weight:900;background:#101522;border:1px solid var(--line)}
.matrix .cell.win{color:var(--green);background:rgba(99,255,50,.08)}
.matrix .cell.loss{color:var(--red);background:rgba(255,77,103,.08)}
.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 82px;gap:12px;align-items:center}
.bar-track{height:12px;background:#0e1320;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--green))}
.bar-val{text-align:right;font-weight:800}
.picker-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.picker-tabs button{background:#101522;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
.picker-tabs button.active{background:var(--purple);color:#fff;border-color:transparent}
.profile-headline{font-size:13px;color:#d7dceb;margin-top:6px}
.profile-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.statbox{background:#101522;border:1px solid var(--line);border-radius:14px;padding:14px}
.statbox .n{font-size:24px;font-weight:900}
.statbox .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.chart{padding:10px 0 2px}
.chart-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:11px 0}
.chart-label{font-size:12px;color:#dbe0ec}
.chart-track{height:18px;background:#101522;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.chart-fill{height:100%;background:linear-gradient(90deg,#6c4dff,#a389ff)}
.note{color:var(--muted);font-size:12px;line-height:1.55}
.method-grid{grid-template-columns:1fr 1fr}
.formula{background:#0e1320;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#dce3f7}
details{background:#101522;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
summary{cursor:pointer;font-weight:800}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:28px 0 8px}
.small{font-size:11px;color:var(--muted)}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.form-strip{display:flex;flex-wrap:wrap;gap:8px}
.form-chip{min-width:56px;background:#101522;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.form-chip .cardlbl{font-size:9px;color:var(--muted);margin-bottom:4px}
.form-chip.win{box-shadow:inset 0 0 0 1px rgba(99,255,50,.3)}
.form-chip.loss{box-shadow:inset 0 0 0 1px rgba(255,77,103,.3)}
.trend-wrap{position:relative;height:190px;background:#0f1320;border:1px solid var(--line);border-radius:14px;padding:10px}
.trend-wrap svg{width:100%;height:100%;overflow:visible}
.trend-label{font-size:10px;fill:#9ba3b5}
.trend-line{fill:none;stroke:#9f84ff;stroke-width:3}
.trend-dot{fill:#f5f7fb;stroke:#8c5cff;stroke-width:2}
.trend-neutral{stroke:#687086;stroke-width:1;stroke-dasharray:4 4}
.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.legend-item{font-size:11px;color:var(--muted)}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .hero-grid{grid-template-columns:1fr}
  .picks-grid{grid-template-columns:repeat(2,1fr)}
  .profile-hero{grid-template-columns:repeat(2,1fr)}
  .profile-grid{grid-template-columns:1fr}
  .method-grid{grid-template-columns:1fr}
}
@media (max-width:680px){
  .app{padding:10px}
  .header{position:static;align-items:flex-start;flex-direction:column}
  .nav{width:100%;overflow:auto;flex-wrap:nowrap}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .picks-grid{grid-template-columns:1fr}
  .profile-hero{grid-template-columns:1fr 1fr}
  .matrix{grid-template-columns:90px repeat(1,70px)}
  .table-wrap{overflow-x:auto}
}

/* v1.2 production mobile UX */
@media (max-width:680px){
  body{overflow-x:hidden}
  .app{max-width:100%;overflow-x:hidden}
  .header{gap:14px}
  .brand{width:100%}
  .brand h1{font-size:19px}
  .brand .sub{font-size:12px}
  .nav{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:7px;
    width:100%;
    overflow:visible;
  }
  .nav button{
    min-width:0;
    width:100%;
    padding:9px 5px;
    font-size:12px;
    line-height:1.15;
    white-space:normal;
  }
  .nav button:nth-child(1),
  .nav button:nth-child(2),
  .nav button:nth-child(3){grid-column:span 2}
  .nav button:nth-child(4),
  .nav button:nth-child(5){grid-column:span 3}

  .card{padding:14px;border-radius:16px}
  .kpis{gap:10px}
  .kpi .value{font-size:24px}
  .kpi .label{font-size:10px}
  .kpi .hint{font-size:11px}

  /* Core mobile views should never require lateral scrolling. */
  .table-wrap{overflow-x:visible}
  #overview table{table-layout:fixed}
  #overview th,#overview td{white-space:normal;padding:10px 6px}

  /* Hide desktop-only leaderboard columns on phones. */
  #overview table th:nth-child(5),
  #overview table td:nth-child(5),
  #overview table th:nth-child(6),
  #overview table td:nth-child(6),
  #overview table th:nth-child(7),
  #overview table td:nth-child(7),
  #overview table th:nth-child(8),
  #overview table td:nth-child(8){display:none}
  #overview table th:nth-child(1),#overview table td:nth-child(1){width:13%}
  #overview table th:nth-child(2),#overview table td:nth-child(2){width:28%}
  #overview table th:nth-child(3),#overview table td:nth-child(3){width:20%}
  #overview table th:nth-child(4),#overview table td:nth-child(4){width:20%}
  #overview table th:nth-child(9),#overview table td:nth-child(9){width:19%;text-align:right}
  #overview table th:nth-child(9){font-size:0}
  #overview table th:nth-child(9)::after{content:"Perf.";font-size:11px}
  #overview table td:nth-child(9){font-size:12px}

  /* Week snapshot bars: name + bounded responsive score bar/value. */
  #overview .chart .bar-row{
    grid-template-columns:68px minmax(0,1fr) 46px;
    gap:8px;
    width:100%;
  }
  #overview .chart .bar-track{min-width:0;width:100%}
  #overview .chart .bar-val{font-size:11px}

  /* Card matrix: mobile uses result chips instead of a wide grid. */
  .matrix{
    display:grid!important;
    grid-template-columns:72px minmax(0,1fr)!important;
    gap:7px!important;
    width:100%;
  }
  .matrix .head{display:none}
  .matrix .rowlabel{font-size:12px}
  .matrix .cell{
    width:100%;
    min-width:0;
    height:38px;
    justify-content:flex-start;
    padding-left:14px;
  }

  /* Weekly pick cards and profile tables wrap instead of overflowing. */
  #weekly .picks-grid{grid-template-columns:1fr}
  #pickers table{table-layout:fixed}
  #pickers th,#pickers td{white-space:normal;word-break:break-word;padding:8px 5px;font-size:11px}
  #pickers table th:nth-child(4),#pickers table td:nth-child(4),
  #pickers table th:nth-child(7),#pickers table td:nth-child(7),
  #pickers table th:nth-child(8),#pickers table td:nth-child(8){display:none}
  #pickers .badge{padding:3px 5px;font-size:9px}
  #pickers .type-icon,#pickers .type-icon svg{width:12px;height:12px}

  #analytics table{table-layout:fixed}
  #analytics th,#analytics td{white-space:normal;word-break:break-word;padding:8px 5px;font-size:11px}
  #methodology table{table-layout:fixed}
  #methodology th,#methodology td{white-space:normal;word-break:break-word;padding:8px 5px;font-size:11px}

  .section-title{align-items:flex-start}
  .section-title h2{font-size:16px}
  .section-title span{font-size:10px;text-align:right}
  .profile-headline{line-height:1.45}
  .chart-row{grid-template-columns:92px minmax(0,1fr) 62px;gap:7px}
  .bar-row{grid-template-columns:82px minmax(0,1fr) 58px;gap:7px}
}


/* v1.3 structural mobile refinements */
.mobile-history,.analytics-mobile{display:none}
.compact-type{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid currentColor;font-weight:900}
.compact-type.goblin{color:var(--green);background:rgba(99,255,50,.08)}
.compact-type.demon{color:var(--red);background:rgba(255,77,103,.08)}
.compact-type.std{color:#c8cfdb;background:rgba(155,163,181,.10)}
.compact-type .type-icon,.compact-type .type-icon svg{width:16px;height:16px}
.week-panel{padding:0;overflow:hidden;margin-bottom:12px}
.week-panel>summary{list-style:none}
.week-panel>summary::-webkit-details-marker{display:none}
.week-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
.week-title{font-size:20px;font-weight:900}
.week-meta{font-size:12px;color:var(--muted);margin-top:4px}
.week-result{display:flex;align-items:center;gap:10px}
.week-result>strong{font-size:26px;white-space:nowrap}
.week-result .chev{font-size:28px;color:var(--muted);transition:transform .18s}
.week-panel[open] .chev{transform:rotate(90deg)}
.week-body{border-top:1px solid var(--line);padding:14px}
.compact-pick{padding:13px}
.pick-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.picker-prominent{font-size:17px;font-weight:900;letter-spacing:.01em}
.pick-result-score{display:flex;align-items:center;gap:10px}
.pick-result-score strong{font-size:20px}
.pick-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
.compact-pick .player{font-size:17px;margin-top:4px}
.compact-pick .score-label{margin-top:8px}
.compact-pick .score-detail{margin-top:9px;padding:9px 11px}
.week-financial{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding:0 2px 2px}
.profile-headline+.record,.card-header>.record{white-space:nowrap}
.card-header .record{white-space:nowrap}

@media (max-width:680px){
  .weekly-accordion{display:flex;flex-direction:column;gap:8px}
  .week-summary{padding:13px 14px}
  .week-title{font-size:18px}
  .week-result>strong{font-size:22px}
  .week-result .result{font-size:11px}
  .week-body{padding:10px}
  .compact-picks{gap:9px}
  .compact-pick{padding:12px}
  .picker-prominent{font-size:18px;color:#fff}
  .pick-result-score{gap:7px}
  .pick-result-score strong{font-size:18px}
  .compact-pick .player{font-size:16px}
  .compact-pick .prop{font-size:12px}
  .compact-pick .mini-bar{margin-top:7px}
  .week-financial{font-size:10px;gap:9px}

  #pickers .card-header{align-items:flex-start}
  #pickers .card-header>.record{font-size:34px;line-height:1;min-width:max-content;white-space:nowrap}
  #pickers .profile-headline{padding-right:8px}

  .desktop-history{display:none}
  .mobile-history{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .history-row{
    display:grid;
    grid-template-columns:52px minmax(0,1fr) 30px 38px 44px;
    gap:7px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)
  }
  .history-card{font-size:10px;color:var(--muted)}
  .history-main{min-width:0}
  .history-main strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .history-main span{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:normal}
  .history-row .result{font-size:10px}
  .history-score{font-size:11px;font-weight:900;text-align:right}
  .compact-type{width:26px;height:26px}

  .analytics-desktop{display:none}
  .analytics-mobile{display:flex;flex-direction:column}
  .category-mobile-row{padding:14px 0;border-bottom:1px solid var(--line)}
  .category-mobile-row:last-child{border-bottom:0}
  .category-mobile-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .category-mobile-top strong{font-size:14px}
  .category-mobile-top span{font-size:10px;color:var(--muted)}
  .category-mobile-stats{display:grid;grid-template-columns:.75fr 1fr 1.25fr;gap:8px;margin-top:11px}
  .category-mobile-stats span{background:#101522;border:1px solid var(--line);border-radius:10px;padding:8px}
  .category-mobile-stats b{display:block;font-size:13px;white-space:nowrap}
  .category-mobile-stats small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;margin-top:3px}
  .small-sample-text{display:inline-block;margin-top:8px;font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 7px}

  .footer{font-size:10px}
}

</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1>PrizePicks Group Tracker</h1>
        <div class="sub">2026 NFL Season · Updated through Week 1</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="active" data-view="overview">Overview</button>
      <button data-view="weekly">Weekly Cards</button>
      <button data-view="pickers">Pickers</button>
      <button data-view="analytics">Analytics</button>
      <button data-view="methodology">Methodology</button>
    </nav>
  </header>

  <main>
    <section id="overview" class="view active"></section>
    <section id="weekly" class="view"></section>
    <section id="pickers" class="view"></section>
    <section id="analytics" class="view"></section>
    <section id="methodology" class="view"></section>
  </main>

  <div class="footer">PrizePicks Group Tracker · 2026 NFL Season</div>
</div>

-Outcome-v1.0", "difficulty_model": "PP-Difficulty-v1.0", "parameter_registry": "NFL-Props-v1.0", "notes": null, "display_label": "W1 \u00b7 Main"}], "parameter_registry": [{"prop_category": "Passing Yards", "s_value": 86.0, "sigma_value": 75.0, "status": "Validated"}, {"prop_category": "Receiving Yards", "s_value": 43.0, "sigma_value": 30.0, "status": "Validated"}, {"prop_category": "Rushing Yards", "s_value": 36.0, "sigma_value": 25.0, "status": "Validated"}, {"prop_category": "Receptions", "s_value": 2.9, "sigma_value": 1.8, "status": "Validated"}, {"prop_category": "Rush+Rec Yards", "s_value": 36.0, "sigma_value": 28.0, "status": "Validated"}, {"prop_category": "Pass Completions", "s_value": 8.6, "sigma_value": 5.0, "status": "Validated"}, {"prop_category": "Rush Attempts", "s_value": 6.0, "sigma_value": 4.5, "status": "Validated"}, {"prop_category": "TD-type Counts", "s_value": 1.44, "sigma_value": 0.6, "status": "Validated"}, {"prop_category": "FG Made", "s_value": 1.44, "sigma_value": 0.7, "status": "Validated"}, {"prop_category": "Fantasy Score", "s_value": 6.0, "sigma_value": 4.5, "status": "Validated"}, {"prop_category": "Pass Attempts", "s_value": 13.2, "sigma_value": 7.7, "status": "Derived"}, {"prop_category": "Rec Targets", "s_value": 4.5, "sigma_value": 2.8, "status": "Derived"}, {"prop_category": "Pass+Rush Yards", "s_value": 93.0, "sigma_value": 79.0, "status": "Derived"}]};

const fmtPct = (n,d=1) => `${n.toFixed(d)}%`;

const demonIcon = `<span class="type-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7C3.5 6 2.5 4 3 2c2.5 1 4.3 2.4 5 4"/><path d="M18 7c2.5-1 3.5-3 3-5-2.5 1-4.3 2.4-5 4"/><path d="M5 8c1.4-1.8 3.8-3 7-3s5.6 1.2 7 3c.8 1.1 1.2 2.4 1.2 4 0 4.8-3.6 8-8.2 8S3.8 16.8 3.8 12C3.8 10.4 4.2 9.1 5 8Z"/><path d="m7.5 12 2 1M16.5 12l-2 1"/><path d="M9 16c2-1 4-1 6 0"/></svg></span>`;

const pickBadge = t => t==="Goblin"
  ? `<span class="badge goblin">${goblinIcon} Goblin</span>`
  : t==="Demon"
  ? `<span class="badge demon">${demonIcon} Demon</span>`
  : '<span class="badge std">Standard</span>';

const compactType = t => t==="Goblin"
  ? `<span class="compact-type goblin" title="Goblin">${goblinIcon}</span>`
  : t==="Demon"
  ? `<span class="compact-type demon" title="Demon">${demonIcon}</span>`
  : `<span class="compact-type std" title="Standard">S</span>`;

const resultClass = r => r==="Win" ? "win" : r==="Loss" ? "loss" : "";
const resultIcon = r => r==="Win" ? "✅" : r==="Loss" ? "❌" : "➖";
const perfLabel = s => s>=90 ? "Crushed It" : s>=70 ? "Clear Win" : s>50 ? "Narrow Win" : s===50 ? "Neutral" : s>=30 ? "Narrow Loss" : s>=10 ? "Bad Miss" : "Way Off";

function statsForPicker(name){
  const ps = picks.filter(p=>p.picker===name).sort((a,b)=>a.week-b.week);
  const wins = ps.filter(p=>p.result==="Win").length;
  const losses = ps.filter(p=>p.result==="Loss").length;
  const decisions = wins+losses;
  const hit = decisions ? wins/decisions*100 : 0;
  const avgBase = ps.length ? ps.reduce((a,p)=>a+p.base_score,0)/ps.length : 0;
  const avgAdj = ps.length ? ps.reduce((a,p)=>a+p.adjusted_score,0)/ps.length : 0;
  const best = ps.length ? Math.max(...ps.map(p=>p.adjusted_score)) : 0;
  const byType = ["Goblin","Standard","Demon"].map(type=>{
    const arr=ps.filter(p=>p.pick_type===type);
    const w=arr.filter(p=>p.result==="Win").length;
    const l=arr.filter(p=>p.result==="Loss").length;
    return {type,w,l,n:w+l,rate:(w+l)?w/(w+l)*100:null};
  });
  let streakType=null, streak=0;
  for(let i=ps.length-1;i>=0;i--){
    if(!["Win","Loss"].includes(ps[i].result)) continue;
    if(streakType===null){streakType=ps[i].result; streak=1;}
    else if(ps[i].result===streakType) streak++;
    else break;
  }
  return {name,ps,wins,losses,decisions,hit,avgBase,avgAdj,best,byType,streakType,streak};
}

function sortedLeaderboard(){
  return participants.map(statsForPicker).sort((a,b)=>
    (b.hit-a.hit)||(b.wins-a.wins)||(b.avgAdj-a.avgAdj)
  );
}

function typeRecordText(s,type){
  const t=s.byType.find(x=>x.type===type);
  if(!t || !t.n) return "—";
  return `${t.w}-${t.l} (${fmtPct(t.rate)})`;
}

          <div><div class="record">4–1</div><div class="card-sub">5-Pick Flex · Win</div></div>
          <div style="text-align:right"><div style="font-size:22px;font-weight:900;color:var(--green)">+$12.50</div><div class="small">$25 entered · $37.50 paid</div></div>
        </div>
        <div class="chart" style="margin-top:14px">${scoreBars(leaderboard)}</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="section-title"><h2>Picker × Card Matrix</h2><span>Special cards retain their own labels</span></div>
      ${renderMatrix()}
    </div>
  `;
}

function scoreBars(stats){
  return stats.map(s=>`
    <div class="bar-row">
      <div class="chart-label">${s.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,s.avgAdj))}%"></div></div>
      <div class="bar-val">${s.avgAdj.toFixed(2)}</div>
    </div>`).join("");
}

function renderMatrix(){
  const allCards=[...cards].sort((a,b)=>a.week-b.week || a.card_name.localeCompare(b.card_name));
  const cols = Math.max(1, allCards.length);
  return `<div class="matrix" style="grid-template-columns:130px repeat(${cols},90px)">
    <div></div>${allCards.map(c=>`<div class="head">${c.display_label}</div>`).join("")}
    ${participants.map(name=>{
      const cells=allCards.map(c=>{
        const p=picks.find(x=>x.picker===name && x.card_id===c.card_id);
        return `<div class="cell ${resultClass(p?.result)}">${p?resultIcon(p.result):"—"}</div>`;
      }).join("");
      return `<div class="rowlabel">${name}</div>${cells}`;
    }).join("")}
  </div>`;
}

function streakText(s){
  if(!s.streakType || !s.streak) return "—";
  return `${s.streakType==="Win"?"W":"L"}${s.streak}`;
}

function seasonFormHTML(s){
  return `<div class="form-strip">${s.ps.map(p=>`
    <div class="form-chip ${resultClass(p.result)}">
      <div class="cardlbl">${p.display_label}</div>
      <div>${resultIcon(p.result)}</div>
      <div style="margin-top:4px">${p.pick_type==="Goblin" ? pickBadge("Goblin") : p.pick_type==="Demon" ? pickBadge("Demon") : '<span class="small">STD</span>'}</div>
    </div>`).join("")}</div>`;
}

function performanceTrendHTML(s){
  const arr=s.ps;
  if(!arr.length) return `<div class="note">No scored picks yet.</div>`;
  const W=520,H=150,pad=24;
  const x = i => arr.length===1 ? W/2 : pad + i*(W-2*pad)/(arr.length-1);
  const y = v => H-pad - (v/100)*(H-2*pad);
  const points=arr.map((p,i)=>`${x(i)},${y(p.adjusted_score)}`).join(" ");
  const dots=arr.map((p,i)=>`<circle class="trend-dot" cx="${x(i)}" cy="${y(p.adjusted_score)}" r="4"><title>${p.display_label}: ${p.adjusted_score.toFixed(2)}</title></circle>`).join("");
  const labels=arr.map((p,i)=>`<text class="trend-label" x="${x(i)}" y="${H-4}" text-anchor="middle">${p.display_label.replace(" · Main","")}</text>`).join("");
  return `<div class="trend-wrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line class="trend-neutral" x1="${pad}" x2="${W-pad}" y1="${y(50)}" y2="${y(50)}"></line>
      <text class="trend-label" x="2" y="${y(50)-3}">50</text>
      ${arr.length>1 ? `<polyline class="trend-line" points="${points}"></polyline>` : ""}
      ${dots}${labels}
    </svg>
  </div>`;
}

function pickTypePerformanceHTML(s){
  return s.byType.map(t=>{
    const rate=t.rate==null?0:t.rate;
    const badge=t.type==="Goblin"?pickBadge("Goblin"):t.type==="Demon"?pickBadge("Demon"):'<span class="badge std">Standard</span>';
    return `<div class="chart-row">
      <div class="chart-label">${badge}</div>
      <div class="chart-track"><div class="chart-fill" style="width:${rate}%"></div></div>
      <div class="bar-val">${t.n?fmtPct(rate):"—"}<div class="small">${t.n?`(${t.w}/${t.n})`:"n=0"}</div></div>
    </div>`;
  }).join("");
}

function propCategoryHTML(s){
  const byCat=Object.values(s.ps.reduce((acc,p)=>{
    acc[p.prop_category] ||= {cat:p.prop_category,n:0,w:0,l:0,total:0};
    acc[p.prop_category].n++;
    acc[p.prop_category].w += p.result==="Win"?1:0;
    acc[p.prop_category].l += p.result==="Loss"?1:0;
    acc[p.prop_category].total += p.adjusted_score;
    return acc;
  },{})).sort((a,b)=>b.n-a.n || b.total/b.n-a.total/a.n);
  return `<div class="table-wrap"><table>
    <thead><tr><th>Category</th><th>Record</th><th>Hit %</th><th>Avg Performance</th><th>Sample</th></tr></thead>
    <tbody>${byCat.map(x=>`
      <tr><td>${x.cat}</td><td>${x.w}-${x.l}</td><td>${fmtPct(x.w/x.n*100)}</td><td>${(x.total/x.n).toFixed(2)}</td><td>${x.n<3?'<span class="badge std">Small Sample</span>':x.n}</td></tr>`).join("")}
    </tbody>
  </table></div>`;
}

      </div>

      <div class="profile-grid">
        <div class="card" style="box-shadow:none;background:#111522">
          <div class="section-title"><h2>Performance Trend</h2><span>50 = neutral line</span></div>
          ${performanceTrendHTML(s)}
        </div>
        <div class="card" style="box-shadow:none;background:#111522">
          <div class="section-title"><h2>Pick-Type Performance</h2><span>Sample size shown</span></div>
          <div class="chart">${pickTypePerformanceHTML(s)}</div>
        </div>
      </div>

      <div class="card" style="box-shadow:none;background:#111522;margin-bottom:16px">
        <div class="section-title"><h2>Prop Category Performance</h2><span>Small samples labeled</span></div>
        ${propCategoryHTML(s)}
      </div>

      <div class="section-title"><h2>Complete Pick History</h2><span>Card labels support holiday/special cards</span></div>
      <div class="table-wrap picker-history desktop-history">
      <table>
        <thead><tr><th>Card</th><th>Player</th><th>Prop</th><th>Line</th><th>Pick</th><th>Type</th><th>Actual</th><th>Δ</th><th>Result</th><th>Performance</th></tr></thead>
        <tbody>${s.ps.map(p=>`
          <tr><td>${p.display_label}</td><td class="picker">${p.player}</td><td>${p.prop_category}</td><td>${p.line}</td><td>${p.direction}</td><td>${pickBadge(p.pick_type)}</td><td>${p.actual}</td><td>${p.signed_delta>0?"+":""}${p.signed_delta}</td><td class="result ${resultClass(p.result)}">${p.result}</td><td><strong>${p.adjusted_score.toFixed(2)}</strong></td></tr>
        `).join("")}</tbody>
      </table></div>
      <div class="mobile-history">
        ${s.ps.map(p=>`
          <div class="history-row">
            <div class="history-card">${p.display_label}</div>
            <div class="history-main"><strong>${p.player}</strong><span>${p.direction} ${p.line} · ${p.prop_category}</span></div>
            <div>${compactType(p.pick_type)}</div>
            <div class="result ${resultClass(p.result)}">${p.result}</div>
            <div class="history-score">${p.adjusted_score.toFixed(2)}</div>
          </div>`).join("")}
      </div>
    </div>`;
}

function renderAnalytics(){
  const byType = ["Goblin","Standard","Demon"].map(type=>{
    const arr=picks.filter(p=>p.pick_type===type);
    const w=arr.filter(p=>p.result==="Win").length;
    const l=arr.filter(p=>p.result==="Loss").length;
    return {type,n:w+l,w,l,rate:(w+l)?w/(w+l)*100:0,avg:arr.length?arr.reduce((a,p)=>a+p.adjusted_score,0)/arr.length:0};
  });
  const byCat = Object.values(picks.reduce((acc,p)=>{
    acc[p.prop_category] ||= {cat:p.prop_category,n:0,w:0,l:0,total:0};
    acc[p.prop_category].n++;
    acc[p.prop_category].w += p.result==="Win" ? 1:0;
    acc[p.prop_category].l += p.result==="Loss" ? 1:0;
    acc[p.prop_category].total += p.adjusted_score;
    return acc;
  },{})).sort((a,b)=>(b.w/b.n)-(a.w/a.n));

  document.getElementById("analytics").innerHTML = `
    <div class="grid hero-grid">
      <div class="card">
        <div class="section-title"><h2>Pick-Type Performance</h2><span>Sample size always shown</span></div>
        <div class="chart">${byType.map(x=>`
          <div class="chart-row">
            <div class="chart-label">${x.type==="Goblin"?pickBadge("Goblin"):x.type==="Demon"?pickBadge("Demon"):'<span class="badge std">Standard</span>'}</div>
            <div class="chart-track"><div class="chart-fill" style="width:${x.rate}%"></div></div>
            <div class="bar-val">${x.n?fmtPct(x.rate):"—"}<div class="small">${x.n?`(${x.w}/${x.n})`:"n=0"}</div></div>
          </div>`).join("")}</div>
      </div>
      <div class="card">
        <div class="section-title"><h2>Card Performance</h2><span>Human selections only</span></div>
        <div class="bar-list">
          ${[5,4,3,2,1,0].map(n=>{
            const count=cards.filter(c=>c.wins===n).length;
            return `<div class="bar-row"><div class="chart-label">${n} / 5</div><div class="bar-track"><div class="bar-fill" style="width:${cards.length?count/cards.length*100:0}%"></div></div><div class="bar-val">${count}</div></div>`;
          }).join("")}
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="section-title"><h2>Prop Category Performance</h2><span>Low samples remain visible and labeled</span></div>
      <div class="table-wrap analytics-desktop">
      <table>
        <thead><tr><th>Category</th><th>Record</th><th>Hit %</th><th>Avg Performance</th><th>Sample</th></tr></thead>
        <tbody>${byCat.map(x=>`
          <tr><td>${x.cat}</td><td>${x.w}-${x.l}</td><td>${fmtPct(x.w/x.n*100)}</td><td>${(x.total/x.n).toFixed(2)}</td><td>${x.n<3?'<span class="badge std">Small Sample</span>':x.n}</td></tr>
        `).join("")}</tbody>
      </table></div>
      <div class="analytics-mobile">
        ${byCat.map(x=>`
          <div class="category-mobile-row">
            <div class="category-mobile-top"><strong>${x.cat}</strong><span>n=${x.n}</span></div>
            <div class="category-mobile-stats">
              <span><b>${x.w}-${x.l}</b><small>Record</small></span>
              <span><b>${fmtPct(x.w/x.n*100)}</b><small>Hit Rate</small></span>
              <span><b>${(x.total/x.n).toFixed(2)}</b><small>Avg Performance</small></span>
            </div>
            ${x.n<3?'<div class="small-sample-text">Small Sample</div>':""}
          </div>`).join("")}
      </div>
    </div>
  `;
}

function renderMethodology(){
  const rows=DATA.parameter_registry.map(r=>`<tr><td>${r.prop_category}</td><td>${r.s_value.toFixed(2)}</td><td>${r.sigma_value.toFixed(2)}</td><td>${r.status}</td></tr>`).join("");
  document.getElementById("methodology").innerHTML = `
    <div class="grid method-grid">
      <div class="card">
        <div class="section-title"><h2>Outcome Model</h2><span>PP-Outcome-v1.0</span></div>
        <div class="formula">Δ = Actual − Line (Over)<br>Δ = Line − Actual (Under)<br><br>Score A = 50 + 50 × tanh(Δ / S)<br>Score B = 100 × Φ(Δ / σ)<br><br>Base Score = (A + B) / 2</div>
        <p class="note">A score of 50 is neutral/on the line. Above 50 means the selection beat the line; below 50 means it missed. A/B are normalized outcome measures, not pregame win probabilities.</p>
      </div>
      <div class="card">
        <div class="section-title"><h2>Difficulty Model</h2><span>PP-Difficulty-v1.0</span></div>
        <div class="formula">Performance = 50 + (Base − 50) × Difficulty Factor<br><br>Goblin Win: ×0.90<br>Goblin Loss: ×1.10<br>Standard: ×1.00<br>Demon Win: ×1.10<br>Demon Loss: ×0.90</div>
        <p class="note">Difficulty modifies analytical performance only. It never changes the W-L standings.</p>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="section-title"><h2>Performance Bands</h2><span>Public labels</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Score</th><th>Interpretation</th></tr></thead>
        <tbody>
          <tr><td>90.00–100.00</td><td>Crushed It</td></tr>
          <tr><td>70.00–89.99</td><td>Clear Win</td></tr>
          <tr><td>50.01–69.99</td><td>Narrow Win</td></tr>
          <tr><td>50.00</td><td>Neutral</td></tr>
          <tr><td>30.00–49.99</td><td>Narrow Loss</td></tr>
          <tr><td>10.00–29.99</td><td>Bad Miss</td></tr>
          <tr><td>0.00–9.99</td><td>Way Off</td></tr>
        </tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="section-title"><h2>Parameter Registry</h2><span>NFL-Props-v1.0</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Prop Category</th><th>S</th><th>σ</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="note">Uncalibrated rare categories may enter the ledger with a settled Win/Loss but a pending Performance Score until a category parameter is established.</p>
    </div>
  `;
}

document.querySelectorAll("#nav button").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll("#nav button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(btn.dataset.view).classList.add("active");
}));

renderOverview();
renderWeekly();
renderPickers();
renderAnalytics();
renderMethodology();
</script>
</body>
</html>
